name: Build and Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - 'daykin_backend/**'   # adjust to your repo folder structure

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./daykin_backend
          push: true
          tags: |
            kennedymutebi/daykin-backend:${{ steps.vars.outputs.sha_short }}
            kennedymutebi/daykin-backend:latest
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd ~/daykin/backend
            sed -i "s|image: kennedymutebi/daykin-backend:.*|image: kennedymutebi/daykin-backend:${{ steps.vars.outputs.sha_short }}|" docker-compose.yml
            docker compose pull daykin_backend
            docker compose up -d daykin_backend
            docker compose exec -T daykin_backend python manage.py migrate --noinput